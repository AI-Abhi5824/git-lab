{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 data-i18n="import_csv">Import Students CSV</h4>
        <p class="text-muted">Header must be exactly: <code>prn,name,branch,year,section,email,phone,photo_url,status</code></p>
        <form method="POST" enctype="multipart/form-data">
          <input type="file" name="csv_file" accept=".csv" class="form-control mb-3" required>
          <button class="btn btn-primary btn-lg" type="submit">Upload & Import</button>
        </form>
        {% if errors %}
        <hr>
        <h6>Errors</h6>
        <ul>
          {% for error in errors %}
          <li>{{ error }}</li>
          {% endfor %}
        </ul>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
