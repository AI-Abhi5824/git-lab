{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 data-i18n="students">Students</h4>
  <a href="{{ url_for('add_student') }}" class="btn btn-primary btn-lg" data-i18n="add_student">Add Student</a>
</div>
<form method="GET" class="mb-3">
  <div class="input-group">
    <input name="q" value="{{ query }}" class="form-control form-control-lg" placeholder="Search PRN">
    <button class="btn btn-outline-primary">Search</button>
  </div>
</form>
<div class="table-responsive">
  <table class="table table-bordered align-middle">
    <thead><tr><th>PRN</th><th data-i18n="name">Name</th><th data-i18n="branch">Branch</th><th data-i18n="status">Status</th><th>Actions</th></tr></thead>
    <tbody>
      {% for s in students %}
      <tr>
        <td>{{ s.prn }}</td><td>{{ s.name }}</td><td>{{ s.branch }}</td>
        <td><span class="badge {{ 'bg-success' if s.status=='active' else 'bg-danger' }}">{{ s.status }}</span></td>
        <td>
          <a href="{{ url_for('edit_student', prn=s.prn) }}" class="btn btn-sm btn-warning">Edit</a>
          <form method="POST" action="{{ url_for('delete_student', prn=s.prn) }}" class="d-inline" onsubmit="return confirm('Delete student?');">
            <button class="btn btn-sm btn-danger">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="5" class="text-muted">No students found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
