{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-3">Practical 5: Chatbot Application</h4>
        <p class="text-muted mb-3">Type a question and receive an intelligent response instantly.</p>

        <div id="chatWindow" class="chat-window border rounded p-3 mb-3 bg-light"></div>

        <form id="chatForm" class="d-flex gap-2">
          <input id="chatInput" class="form-control" type="text" placeholder="Ask something... e.g. What is Artificial Intelligence?" autocomplete="off" required>
          <button class="btn btn-primary" type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='chatbot.js') }}"></script>
{% endblock %}
